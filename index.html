<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rummy Poengteller</title>
<link rel="icon" href="icon.png">
<style>
  :root{--bg:#07090d;--card:rgba(255,255,255,.045);--stroke:rgba(255,255,255,.09);--ink:#f4f1ea;--muted:#9a9ea8;--gold:#f2c46d}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background-image:radial-gradient(50% 40% at 50% 0%,rgba(242,196,109,.16),transparent 70%)}
  .wrap{max-width:520px;padding:40px 22px;text-align:center}
  img{width:110px;height:110px;border-radius:26px;box-shadow:0 18px 50px -12px rgba(242,196,109,.5)}
  h1{font-size:34px;margin:22px 0 6px}
  p{color:#cfcbc3;margin:0 0 28px}
  .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a{display:inline-block;padding:13px 20px;border-radius:14px;background:var(--card);border:1px solid var(--stroke);color:var(--ink);text-decoration:none;font-weight:600}
  a.main{background:linear-gradient(135deg,#f2c46d,#e0913f);color:#1b1206;border:0}
</style>
</head>
<body>
<div class="wrap">
  <img src="icon.png" alt="Rummy Poengteller">
  <h1>Rummy Poengteller</h1>
  <p>Poeng, statistikk og online-spill med lyd for marokkansk rummy – for deg og vennegjengen.</p>
  <div class="links">
    <a class="main" href="support.html">Støtte</a>
    <a href="personvern.html">Personvern</a>
  </div>
</div>
</body>
</html>
